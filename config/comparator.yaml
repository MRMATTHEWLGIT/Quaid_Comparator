# The initial policy to use for the comparator
initial_policy: "flat"

# The policies available to the comparator
policies:
  flat:
    model_path: "models/onnx/aug_act_net_QuaidSIM-Flat_RA-TD3_+305.334_475000.onnx"

  ramp:
    model_path: "models/onnx/aug_act_net_QuaidSIM-Ramp_RA-TD3_+301.146_475000.onnx"

  uneven:
    model_path: "models/onnx/aug_act_net_QuaidSIM-Uneven_RA-TD3_+348.233_400099.onnx"

# Runtime comparator assets generated by build_comparator.py
comparator_assets_dir: "models/comparator/comparator_parametric_2026-05-14T22-15-54"
# comparator_assets_dir: "models/comparator/comparator_standard_2026-05-13T16-31-13"

# Comparator hyperparameters
hyperparameters:

  # GRU input sequence length
  sequence_length: 99

  # Local nearest-neighbour search hyperparameters
  k_signature: 80
  k_reward: 80

  # Candidate filtering hyperparameters
  min_reward_gain_percent: 5.0
  min_distribution_overlap: 0.7

  # Candidate scoring hyperparameters
  overlap_weight: 1.0
  pairwise_weight: 0.5
  local_reward_weight: 0.5

  # Minimum interval/timesteps between policy switches
  min_switch_interval: 30
